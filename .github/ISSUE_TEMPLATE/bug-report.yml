name: Bug report
description: Report a problem with the Dustcode VS Code extension # kilocode_change
labels: ["bug"]
body:
  # kilocode_change start
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Dustcode is this about? This fork maintains only the VS Code extension and its bundled backend.
      options:
        - VS Code extension
        - Bundled backend
        - Agent Manager
        - Documentation
        - Provider connection (including external Kilo Gateway)
        - Other / not sure
    validations:
      required: true
  # kilocode_change end

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug you encountered
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: plugins
    attributes:
      label: Plugins
      description: What plugins are you using?
    validations:
      required: false

  - type: input
    id: dustcode-version # kilocode_change
    attributes:
      # kilocode_change start
      label: Dustcode version
      description: What version of Dustcode (dustcode.dustcode) is installed in VS Code?
      # kilocode_change end
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshot-or-link
    attributes:
      # kilocode_change start
      label: Screenshots or logs
      description: Attach screenshots or relevant logs. Remove credentials, tokens, and private information before submitting.
      placeholder: Paste sanitized logs or drag and drop screenshots here
      # kilocode_change end
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: what OS are you using?
      placeholder: e.g., macOS 26.0.1, Ubuntu 22.04, Windows 11
    validations:
      required: false

  - type: input
    id: vscode-version # kilocode_change
    attributes:
      # kilocode_change start
      label: VS Code version
      description: What version of VS Code are you using?
      placeholder: Copy the version from Help > About
      # kilocode_change end
    validations:
      required: false
