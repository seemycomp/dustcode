name: Feature Request # kilocode_change
description: Suggest an improvement to the Dustcode VS Code extension # kilocode_change
labels: [discussion]
title: "[FEATURE]:"

body:
  - type: checkboxes
    id: verified
    attributes:
      label: Feature hasn't been suggested before.
      options:
        - label: I have verified this feature I'm about to request hasn't been suggested before.
          required: true

  - type: textarea
    attributes:
      label: Describe the enhancement you want to request
      description: What do you want to change or add? What are the benefits of implementing this? Try to be detailed so we can understand your request better :)
    validations:
      required: true

  # kilocode_change start
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Dustcode is this about? This fork maintains only the VS Code extension and its bundled backend.
      options:
        - VS Code extension
        - Bundled backend
        - Agent Manager
        - Documentation
        - Provider connection (including external Kilo Gateway)
        - Other / not sure
    validations:
      required: true
  # kilocode_change end
