# kilocode_change - new file
version: 2
updates:
  # Keep security updates for the shared extension/backend lockfile. Other
  # products remain in source but are not maintained by this fork's CI.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
